services:
  postgres:
    image: postgres:16-alpine
    container_name: topshooter-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topshooter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topshooter}
      POSTGRES_DB: ${POSTGRES_DB:-topshooter}
    volumes:
      - topshooter-pg-data:/var/lib/postgresql/data
    networks:
      - topshooter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-topshooter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  topshooter:
    build: .
    container_name: topshooter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      OWNER_ID: ${OWNER_ID}
      DEV_GUILD_ID: ${DEV_GUILD_ID}
      DATABASE_URL: postgres://${POSTGRES_USER:-topshooter}:${POSTGRES_PASSWORD:-topshooter}@postgres:5432/${POSTGRES_DB:-topshooter}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      BOT_API_HOST: 0.0.0.0
      BOT_API_PORT: 8000
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      STATUS_AUTO_POST_CHANNEL_ID: ${STATUS_AUTO_POST_CHANNEL_ID:-}
      STATUS_TIMEZONE: ${STATUS_TIMEZONE:-America/Chicago}
    networks:
      - topshooter-net
      - n8n_external
    # No ports exposed to host — bot is internal-only.
    # Other containers on `topshooter-net` reach it at http://topshooter:8000
    # n8n (on `root_default` aliased here as `n8n_external`) reaches it the same way.

networks:
  n8n_external:
    # The n8n stack runs in `root_default` (created by /root/docker-compose.yml).
    # We mount it as `external: true` so n8n containers can reach topshooter:8000.
    name: root_default
    external: true
  topshooter-net:
    name: topshooter-net
    driver: bridge

volumes:
  topshooter-pg-data:
    name: topshooter-pg-data
